<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 404 - Page Not Found</title>

  <!-- favicon (inline svg monogram) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='redGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23ff6b6b'/><stop offset='100%' stop-color='%23ff2233'/></linearGradient></defs><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='60' font-weight='800' font-family='Segoe UI, system-ui, sans-serif' fill='url(%23redGrad)' letter-spacing='-3'>AT</text></svg>">

  <!-- bootstrap 5 css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- bootstrap icons cdn -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- theme stylesheets -->
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/404.css">
</head>
<body>
  <!-- dynamic header placeholder -->
  <div id="header-placeholder"></div>

  <!-- main content -->
  <main class="container d-flex align-items-center justify-content-center flex-grow-1 py-5">
    <div class="text-center error-container card-dark p-5">
      <span class="badge badge-red mb-3">Error 404</span>
      <h1 class="error-code text-gradient-red display-1 fw-bold">404</h1>
      <h2 class="h4 text-white mb-3">Oops! Page Not Found</h2>
      <p class="text-muted mb-4 max-w-400 mx-auto">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <div>
        <a href="/" class="btn btn-danger btn-lg me-2">Go to Homepage</a>
        <a href="/projects/" class="btn btn-outline-light btn-lg">View Projects</a>
      </div>
    </div>
  </main>

  <!-- dynamic footer placeholder -->
  <div id="footer-placeholder"></div>

  <!-- scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/global.js"></script>
</body>
</html>
